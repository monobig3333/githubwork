[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --html=report.html
    --self-contained-html
markers =
    perf: 性能テスト
    availability: 可用性テスト
    scalability: 拡張性テスト
    mid: MIDサーバ関連
    high_load: 高負荷シナリオ
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
